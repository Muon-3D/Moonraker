# CI for code style and application tests

name: test-code
# MUON (KAN-708): upstream is `on: [push, pull_request]`, which builds every
# commit on a branch with an open pull request twice. As in Muon3D_Klipper's
# build-test.yaml (KAN-337): `push` only on the default branch, every other
# branch through `pull_request`, and a newer commit on the same pull request
# cancels the run it supersedes.
#
# runs-on stays `ubuntu-22.04`. This repository is public, so GitHub-hosted
# minutes are free, and a self-hosted runner on a public repository would
# let any fork's pull request run code on bigbox (d01f23d reverted 440ef7f
# for that reason). No `vars.LINUX_RUNS_ON` is defined for this repository.
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: test-code-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-python-code:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - uses: weibullguy/python-lint-plus@v1.12.0
        with:
          python-root-list: "moonraker scripts"
          virtual-env: "python-lint-plus"
          python-version: "3.10"
          use-flake8: true
          flake8-version: "==6.1.0"
          use-mypy: true
          mypy-version: "==1.5.1"
          extra-flake8-options: "--ignore=E226,E301,E302,E303,W503,W504 --max-line-length=88 --max-doc-length=88"
          extra-mypy-options: "--ignore-missing-imports --follow-imports=silent"
