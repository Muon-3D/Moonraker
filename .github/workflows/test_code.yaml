# CI for code style and application tests

name: test-code
# MUON (KAN-708): upstream is `on: [push, pull_request]`, which builds every
# commit on a branch with an open pull request twice. As in Muon3D_Klipper's
# build-test.yaml (KAN-337): `push` only on the default branch, every other
# branch through `pull_request`, and a newer commit on the same pull request
# cancels the run it supersedes.
#
# runs-on is the bigbox pool (`vars.LINUX_RUNS_ON`, else the `muon-ci`
# labels): Muon runs no CI on GitHub-hosted runners (Jack, 28 Oct). This
# repository is public, so the job runs only for a push here or a pull request
# from a branch of this repository; a fork's pull request gets no job. That
# `if` is not the security boundary, because a fork's pull request runs the
# workflow file from its own branch: the repository's "Require approval for
# all external contributors" setting is, and it must be on before bigbox
# serves this repository. d01f23d reverted the first switch (440ef7f) because
# neither was in place.
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: test-code-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-python-code:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.LINUX_RUNS_ON || '["self-hosted","muon-ci"]') }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - uses: weibullguy/python-lint-plus@v1.12.0
        with:
          python-root-list: "moonraker scripts"
          virtual-env: "python-lint-plus"
          python-version: "3.10"
          use-flake8: true
          flake8-version: "==6.1.0"
          use-mypy: true
          mypy-version: "==1.5.1"
          extra-flake8-options: "--ignore=E226,E301,E302,E303,W503,W504 --max-line-length=88 --max-doc-length=88"
          extra-mypy-options: "--ignore-missing-imports --follow-imports=silent"
      - name: Install pytest dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libsodium-dev
          python -m pip install \
            -r scripts/moonraker-requirements.txt \
            -r scripts/moonraker-test-requirements.txt
      - name: Run pytest
        run: |
          # KAN-570: these four legacy suites still need the old
          # event-loop harness. Keep every exclusion explicit until it is ported.
          python -m pytest -ra \
            --deselect tests/test_config.py \
            --deselect tests/test_database.py \
            --deselect tests/test_klippy_connection.py \
            --deselect tests/test_server.py
