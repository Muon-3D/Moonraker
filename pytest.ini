[pytest]
minversion = 7.0
# The repository root must come first. `moonraker/` has to stay on the
# path because the suite imports some modules bare (`utils`, `dbtool`),
# but it also contains moonraker.py -- so with `moonraker` first,
# `import moonraker` finds that module instead of the package and every
# `from moonraker.x import y` fails. That made conftest.py unimportable,
# which is why `pytest` collected nothing at all here (KAN-85).
pythonpath = . moonraker scripts
testpaths = tests
required_plugins =
    pytest-asyncio>=0.17.2
    pytest-timeout>=2.1.0
asyncio_mode = strict
timeout = 60
timeout_method = signal
markers =
    run_paths
    no_ws_connect